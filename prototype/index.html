<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>知途 · 本地原型</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <aside class="scenario-panel" aria-label="原型场景面板">
      <p class="eyebrow">知途 · 本地原型</p>
      <h1>本地闹钟</h1>
      <p>高德地图与彩云天气均使用本地 fixture 演示；自动提前评估尚未启用；基础闹钟由 Android 应用实现。</p>
      <label for="scenario-select">查看页面</label>
      <select id="scenario-select">
        <option value="onboarding">首次使用与隐私</option>
        <option value="home">首页</option>
        <option value="weather">天气图（彩云 fixture）</option>
        <option value="route">地点与出行方式</option>
        <option value="route-edit">编辑地点</option>
        <option value="plans">闹钟计划总览</option>
        <option value="plan-edit">添加／编辑闹钟</option>
        <option value="why">提前计算（未启用）</option>
        <option value="settings">通知与可靠性</option>
        <option value="lock">锁屏出发提醒</option>
        <option value="island">超级岛摘要</option>
        <option value="island-expand">超级岛展开详情</option>
        <option value="ringing">提前闹钟响铃</option>
        <option value="history">本机记录</option>
        <option value="failure">评估状态</option>
        <option value="rest">天气缓冲（未用于闹钟）</option>
        <option value="overtime-select">单日覆盖</option>
        <option value="overtime-active">闹钟计划</option>
        <option value="credentials">数据与凭据</option>
        <option value="calendar">工作日历</option>
        <option value="diagnostics">可靠性诊断</option>
        <option value="place-search">选择地点</option>
      </select>
      <label for="permission-device-select">权限演示设备</label>
      <select id="permission-device-select">
        <option value="android">通用 Android</option>
        <option value="xiaomi">小米（演示设备）</option>
      </select>
      <label for="permission-entry-select">系统设置入口</label>
      <select id="permission-entry-select">
        <option value="available">可打开（演示）</option>
        <option value="unavailable">入口不可用或未找到（演示）</option>
      </select>
      <button id="scenario-reset" type="button">重置演示数据</button>
      <p id="render-status" aria-live="polite">正在加载本地设计字体…</p>
      <p class="reference-note">后续开发和验收必须参照此原型；除非用户明确要求修改。</p>
    </aside>
    <div class="stage">
      <div class="device-viewport">
      <div class="device" aria-label="知途手机原型，412 × 892">
        <div id="app"></div>
      </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
