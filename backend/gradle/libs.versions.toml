[versions]
spring-boot = "3.5.16"
bucket4j = "8.18.0"
resilience4j-spring-boot3 = "2.3.2"
testcontainers = "1.20.4"

[libraries]
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-data-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc", version.ref = "spring-boot" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-starter-cache = { group = "org.springframework.boot", name = "spring-boot-starter-cache", version.ref = "spring-boot" }
spring-boot-starter-data-redis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-testcontainers = { group = "org.springframework.boot", name = "spring-boot-testcontainers", version.ref = "spring-boot" }

# Spring Boot BOM import for non-app modules
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }

# Resilience4j
resilience4j-spring-boot3 = { group = "io.github.resilience4j", name = "resilience4j-spring-boot3", version.ref = "resilience4j-spring-boot3" }

# Bucket4j
bucket4j-core = { group = "com.bucket4j", name = "bucket4j-core", version.ref = "bucket4j" }
bucket4j-redis = { group = "com.bucket4j", name = "bucket4j-redis", version.ref = "bucket4j" }

# Flyway
flyway-core = { group = "org.flywaydb", name = "flyway-core", version = "11.8.0" }
flyway-database-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version = "11.8.0" }

# Lettuce (Redis client)
lettuce-core = { group = "io.lettuce", name = "lettuce-core", version = "6.6.2" }

# Database
postgresql = { group = "org.postgresql", name = "postgresql", version = "42.7.5" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version = "6.3.0" }

# Test
testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
