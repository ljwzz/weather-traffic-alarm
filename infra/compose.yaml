services:
  postgres:
    image: postgres:17.4-alpine
    container_name: wta-postgres
    environment:
      POSTGRES_DB: weather_traffic_alarm
      POSTGRES_USER: wta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "5432:5432"
    volumes:
      - wta-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wta -d weather_traffic_alarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: wta-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - wta-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wta-postgres-data:
    name: wta-postgres-data
  wta-redis-data:
    name: wta-redis-data
